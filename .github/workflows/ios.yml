# Builds an unsigned iOS bundle on a GitHub-hosted macOS runner.
#
# This exists because the development machine is Linux and iOS builds require macOS.
# macOS runners are free for public repositories, so the whole build path costs nothing.
# Signing happens afterwards on the device, with the developer's own Apple ID.

name: ios

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: unsigned bundle
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Guard that the mobile app exists
        run: |
          if [ ! -d apps/mobile/ios ]; then
            echo "apps/mobile/ios not present yet, nothing to build (milestone M4)."
            exit 0
          fi

      - name: Build (unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Aera.xcworkspace \
            -scheme Aera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Aera.app Payload/
          zip -qr Aera-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Aera-unsigned-ipa
          path: apps/mobile/ios/Aera-unsigned.ipa
