# Builds an installable iOS app without a Mac.
#
# The development machine is Linux, so the build happens on Expo's hosted
# service, which also handles the Apple signing that otherwise needs Xcode. That
# is why this runs on ubuntu rather than a macOS runner: no local toolchain is
# involved at all.
#
# Needs an EXPO_TOKEN repository secret. Without one the job explains itself and
# stops rather than failing, so a fork or a fresh clone is not greeted by a red
# tick it cannot fix.

name: ios

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Which eas.json build profile to use
        default: development
        type: choice
        options: [development, production]
  push:
    tags: ['v*']

jobs:
  build:
    name: hosted build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret is set, so there is nothing to build with."
            echo "Create one at expo.dev and add it under Settings, Secrets, Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci || npm install

      - uses: expo/expo-github-action@v8
        if: steps.credentials.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/mobile
        run: eas build --platform ios --profile ${{ inputs.profile || 'production' }} --non-interactive --no-wait
