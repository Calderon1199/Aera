name: protocol

on:
  push:
    paths: ['packages/protocol/**', '.github/workflows/protocol.yml']
  pull_request:
    paths: ['packages/protocol/**', '.github/workflows/protocol.yml']
  workflow_dispatch:

jobs:
  test:
    name: decoder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present
